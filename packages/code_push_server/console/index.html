<!doctype html>
<!-- cspell:words apphdr applist collab collabs copybtn copytext ovstats pchips rbar rfill rmcollab rpct -->
<!-- Above are CSS class and element-id names local to this console SPA, not
     prose. Kept inline rather than in the global dictionary so they can't
     mask a real typo elsewhere in the repo. -->
<!-- cspell:ignoreRegExp /[ㄱ-ㆎ가-힣]+/gu -->
<!-- The Korean UI strings (see I18N in the script) are prose in a language
     the spell checker has no dictionary for, so Hangul runs are skipped. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="셀프 호스팅 Shorebird 코드 푸시 컨트롤 플레인 — 앱, 릴리스, 패치, 롤아웃, 분석, 팀 관리.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐦%3C/text%3E%3C/svg%3E">
<title>Shorebird 콘솔</title>
<style>
/* Monochrome two-tone — ink + paper with a grayscale ramp. There is no hue:
   the "accent" is ink itself, and state is conveyed by FILL/WEIGHT, not color
   (active = solid ink pill, inactive = light chip). */
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Code",Consolas,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",monospace;
  --bg:#f4f4f5; --panel:#ffffff; --panel-2:#f0f0f1; --border:#dedede;
  --text:#0d0d0d; --muted:#6b6b6e; --faint:#a1a1a5;
  --accent:#141414; --accent-2:#000000; --accent-fg:#ffffff; --accent-soft:#e9e9ea;
  --ok:#141414; --ok-soft:#e6e6e7; --warn:#5a5a5e; --warn-soft:#e6e6e7;
  --danger:#141414; --danger-bg:#e9e9ea;
  --chip:#eeeeef; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --radius:12px; --bar1:#141414; --bar2:#9a9a9e;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0a0b; --panel:#151516; --panel-2:#1d1d1f; --border:#2b2b2e;
    --text:#f2f2f3; --muted:#9a9a9e; --faint:#67676b;
    --accent:#f2f2f3; --accent-2:#ffffff; --accent-fg:#0a0a0b; --accent-soft:#242427;
    --ok:#f2f2f3; --ok-soft:#242427; --warn:#a6a6aa; --warn-soft:#242427;
    --danger:#f2f2f3; --danger-bg:#242427;
    --chip:#202023; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
    --radius:12px; --bar1:#f2f2f3; --bar2:#77777b;
  }
}
:root[data-theme="light"]{
  --bg:#f4f4f5; --panel:#ffffff; --panel-2:#f0f0f1; --border:#dedede;
  --text:#0d0d0d; --muted:#6b6b6e; --faint:#a1a1a5;
  --accent:#141414; --accent-2:#000000; --accent-fg:#ffffff; --accent-soft:#e9e9ea;
  --ok:#141414; --ok-soft:#e6e6e7; --warn:#5a5a5e; --warn-soft:#e6e6e7;
  --danger:#141414; --danger-bg:#e9e9ea;
  --chip:#eeeeef; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --bar1:#141414; --bar2:#9a9a9e;
}
:root[data-theme="dark"]{
  --bg:#0a0a0b; --panel:#151516; --panel-2:#1d1d1f; --border:#2b2b2e;
  --text:#f2f2f3; --muted:#9a9a9e; --faint:#67676b;
  --accent:#f2f2f3; --accent-2:#ffffff; --accent-fg:#0a0a0b; --accent-soft:#242427;
  --ok:#f2f2f3; --ok-soft:#242427; --warn:#a6a6aa; --warn-soft:#242427;
  --danger:#f2f2f3; --danger-bg:#242427;
  --chip:#202023; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32);
  --bar1:#f2f2f3; --bar2:#77777b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14.5px/1.55 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--accent-2)}
code{background:var(--accent-soft);color:var(--accent-2);padding:.1rem .38rem;border-radius:6px;font:12px/1.4 var(--mono)}
button{font:inherit;font-weight:500;cursor:pointer;padding:.5rem .95rem;border:none;border-radius:9px;background:var(--chip);color:var(--text);transition:background .12s,box-shadow .12s,transform .04s}
button:hover{background:color-mix(in srgb,var(--text) 9%,var(--chip))}
button:active{transform:translateY(.5px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow)}
button.primary:hover{background:var(--accent-2)}
button.danger{color:var(--danger);background:var(--danger-bg)}
button.danger:hover{background:color-mix(in srgb,var(--danger) 16%,var(--danger-bg))}
button.sm{padding:.3rem .68rem;font-size:12.5px;border-radius:7px}
input,select{font:inherit;padding:.52rem .7rem;border:none;border-radius:9px;background:var(--panel-2);color:var(--text)}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
label{font:600 10.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.32rem}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:.62rem .7rem;text-align:left;white-space:nowrap}
th{font:600 10.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
tbody tr:hover{background:var(--panel-2)}
.wrap{max-width:1180px;margin:0 auto;padding:1rem}

/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--panel);box-shadow:var(--shadow)}
.top{display:flex;flex-wrap:wrap;align-items:end;gap:.7rem;max-width:1180px;margin:0 auto;padding:.7rem 1rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:16px;margin-right:.4rem}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
.field{display:flex;flex-direction:column}
.field.grow{flex:1;min-width:150px}
.status{display:flex;align-items:center;gap:.4rem;font-size:12px;color:var(--muted);margin-left:auto}
.status .led{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.ok .led{background:var(--ok)} .status.err .led{background:var(--danger)} .status.busy .led{background:var(--warn)}

/* layout */
.grid{display:grid;grid-template-columns:300px 1fr;gap:1rem;margin-top:1rem;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel .hd{padding:1.05rem 1.4rem .3rem;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:.5rem;letter-spacing:-.01em}
.panel .bd{padding:1.1rem 1.4rem 1.3rem}
.section{margin-top:1.6rem}
.section h2{font:600 11px/1.4 var(--mono);margin:0 0 .65rem;color:var(--accent);text-transform:uppercase;letter-spacing:.13em}

/* app-detail header + tabs */
.apphdr{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.15rem}
.apphdr h1{font-size:1.4rem;letter-spacing:-.02em;margin:0}
.tabs{display:flex;gap:.25rem;margin:1rem 0 1.4rem;overflow-x:auto}
.tab{appearance:none;background:none;border:none;border-radius:9px;
  padding:.5rem 1rem;font:600 13.5px/1 var(--font);color:var(--muted);cursor:pointer;box-shadow:none;white-space:nowrap;transition:background .12s,color .12s}
.tab:hover{color:var(--text);background:var(--panel-2)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.active{color:var(--accent-2);background:var(--accent-soft)}
.tab .pill{margin-left:.45rem}

/* app list */
.applist{list-style:none;margin:0;padding:0}
.applist li{padding:.62rem .8rem;border-radius:10px;cursor:pointer;transition:background .12s}
.applist li:hover{background:var(--panel-2)}
.applist li.active{background:var(--accent-soft)}
.applist li.active .name{color:var(--accent-2)}
.applist .name{font-weight:600}
.applist .meta{font:11px/1.4 var(--mono);color:var(--muted);margin-top:.12rem}

.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.14rem .55rem;border-radius:999px;font:600 11px/1.4 var(--mono);letter-spacing:.02em;background:var(--chip);color:var(--muted)}
.pill.active{background:var(--accent);color:var(--accent-fg)}
.pill.draft{background:var(--chip);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-2)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end}
.card{border-radius:12px;padding:1.05rem 1.1rem;margin-bottom:.7rem;background:var(--panel-2)}
.card:last-child{margin-bottom:0}
.card .title{font-weight:600;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.kv{display:flex;gap:1.3rem;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:.25rem}
.stat{display:inline-flex;flex-direction:column;gap:.2rem;padding:.85rem 1.05rem;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);min-width:112px}
.stat .n{font-size:23px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font:600 10px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.stats{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem}
details{border-radius:11px;margin-bottom:.6rem;background:var(--panel-2);overflow:hidden}
details:last-child{margin-bottom:0}
details>summary{padding:.72rem .9rem;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8";color:var(--muted);font-size:11px}
details[open]>summary::before{content:"\25BE"}
details .inner{padding:.2rem .9rem .9rem}
.toast{position:fixed;bottom:1rem;right:1rem;z-index:50;display:flex;flex-direction:column;gap:.5rem}
.toast div{background:var(--panel);border-radius:10px;padding:.7rem .9rem;box-shadow:inset 3px 0 0 var(--accent),var(--shadow);max-width:340px;font-size:13px;animation:in .15s ease}
.toast div.ok{box-shadow:inset 3px 0 0 var(--ok),var(--shadow)} .toast div.err{box-shadow:inset 3px 0 0 var(--danger),var(--shadow)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.notes{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.rollout{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.65rem}
.rollout input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:120px;height:7px;
  border-radius:999px;cursor:pointer;
  background:linear-gradient(var(--accent),var(--accent)) 0/var(--fill,0%) 100% no-repeat,var(--chip)}
.rollout input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.rollout input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rollout input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;
  background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rollout .pct{width:3.8rem;text-align:center}
.empty{color:var(--muted);padding:.6rem 0;font-style:italic}
.scroll{overflow-x:auto}
.err-box{color:var(--danger);background:var(--danger-bg);border-radius:9px;padding:.7rem .9rem;font-size:13px}
svg text{fill:var(--muted);font-size:11px}
hr{border:none;height:0;margin:1.1rem 0}
.legend{display:flex;gap:1rem;font-size:12px;color:var(--muted);margin:.3rem 0}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
.ana-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1.15rem}
.ana-card{margin:0}
.ana-card .bd{padding:.6rem 1.4rem 1.15rem}

/* ---- app shell + connect gate ---- */
.logo{line-height:1}
.gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(1100px 560px at 50% -12%,var(--accent-soft),transparent 62%),var(--bg)}
.gate-card{width:min(420px,100%);background:var(--panel);
  border-radius:18px;box-shadow:var(--shadow);padding:2rem 1.8rem;display:flex;flex-direction:column;gap:.95rem}
.gate-brand{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem}
.gate-brand .logo{font-size:2rem}
.gate-brand .gt{font-weight:700;font-size:1.2rem;letter-spacing:-.015em}
.gate-brand .gs{font:10.5px/1.4 var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:.15rem}
.block{width:100%;justify-content:center;display:inline-flex;align-items:center}
.gate-foot{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-top:.1rem}

.shell{display:grid;grid-template-columns:288px 1fr;min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;
  background:var(--panel)}
.side-top{padding:1.1rem 1.1rem .9rem;display:flex;flex-direction:column;gap:.6rem}
.side-top .brand{font-weight:700;font-size:1.08rem;display:flex;align-items:center;gap:.5rem}
.side-top .logo{font-size:1.25rem}
.conn{display:flex;align-items:center;gap:.42rem;font:11px/1.4 var(--mono);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-actions{display:flex;flex-wrap:wrap;gap:.4rem}
.side-actions button{white-space:nowrap}
.side-scroll{flex:1;overflow-y:auto;padding:.85rem}
.nav-h{font:600 10.5px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  padding:.4rem .8rem .55rem;display:flex;align-items:center;justify-content:space-between}
.nav-team{margin-top:1.4rem;padding-top:.4rem}
.side-filter{width:100%;margin:0 0 .6rem;padding:.5rem .7rem;font-size:12.5px}
.side-scroll .applist li{margin-bottom:.15rem}
.create{border-radius:11px;margin-top:.7rem;background:var(--panel-2)}
.create>summary{padding:.6rem .8rem;cursor:pointer;font:600 12.5px/1.4 var(--font);list-style:none;color:var(--accent-2)}
.create>summary::-webkit-details-marker{display:none}
.create-bd{padding:.15rem .8rem .8rem;display:flex;flex-direction:column;gap:.6rem}
.main{min-width:0;padding:1.75rem clamp(1rem,3.2vw,2.5rem)}
#detail{max-width:1200px;margin-inline:auto}
.led.ok{background:var(--ok)}

/* overview / welcome */
.hero{text-align:center;padding:2.6rem 1rem 1.6rem;color:var(--muted);max-width:600px;margin-inline:auto}
.hero .logo{font-size:2.4rem;display:block;margin-bottom:.5rem;opacity:.9}
.hero h1{font-size:1.45rem;color:var(--text);margin:.2rem 0 .45rem;letter-spacing:-.015em}
.ovstats{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:1.3rem}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .side-scroll{max-height:none}
  .main{padding:1rem}
}

/* quick-start / onboarding + copyable code + loading skeletons */
.qs{background:var(--panel);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:1.35rem 1.45rem;max-width:640px;margin:1.5rem auto 0;text-align:left}
.qs h3{margin:0 0 .25rem;font-size:1.05rem;letter-spacing:-.01em}
.qs p{margin:.15rem 0 .8rem;color:var(--muted);font-size:13px}
.codeblock{position:relative;background:#141414;color:#e8e8e8;border-radius:11px;
  padding:.95rem 1.05rem;font:12px/1.65 var(--mono);overflow-x:auto;white-space:pre}
.copybtn{position:absolute;top:.5rem;right:.5rem;padding:.18rem .55rem;font:600 10px/1.4 var(--mono);
  letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.1);color:#cfe8ea;
  border:none;border-radius:6px;cursor:pointer}
.copybtn:hover{background:rgba(255,255,255,.2)}
@keyframes shimmer{0%{background-position:-450px 0}100%{background-position:450px 0}}
.skeleton{border-radius:8px;height:14px;margin:.6rem 0;
  background:linear-gradient(90deg,var(--panel-2) 25%,var(--chip) 37%,var(--panel-2) 63%);
  background-size:900px 100%;animation:shimmer 1.3s infinite linear}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.modal-backdrop,.toast div{animation:none}}

/* patch deployment state + rollout bars */
.deploys{display:flex;flex-direction:column;gap:.5rem;margin:.65rem 0}
.deploy{display:flex;align-items:center;gap:.6rem;font-size:12.5px}
.deploy .dch{font:600 12px/1 var(--mono);min-width:66px;color:var(--text)}
.rbar{position:relative;flex:1;max-width:170px;height:7px;border-radius:999px;background:var(--chip);overflow:hidden}
.rfill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.rpct{font:600 11px/1 var(--mono);color:var(--muted);min-width:36px;text-align:right}

/* confirm modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,12,15,.55);display:grid;place-items:center;
  z-index:60;animation:in .12s ease}
.modal{width:min(430px,92vw);background:var(--panel);border-radius:16px;
  box-shadow:var(--shadow);padding:1.4rem 1.5rem}
.modal h3{margin:0 0 .5rem;font-size:1.1rem;letter-spacing:-.01em}
.modal p{margin:0 0 1.2rem;color:var(--muted);font-size:13.5px;line-height:1.55}
.modal .actions{display:flex;justify-content:flex-end;gap:.6rem}
.applist li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}

/* Hangul has no letter case and the mono stacks have no Hangul glyphs (the
   fallback sets every syllable full-width), so the tracked-out uppercase mono
   label style only spreads Korean words apart. Use the UI font, tighter. */
:lang(ko) label,:lang(ko) th,:lang(ko) .stat .l,:lang(ko) .nav-h,:lang(ko) .section h2,
:lang(ko) .gate-brand .gs,:lang(ko) .copybtn{font-family:var(--font);letter-spacing:.01em}
:lang(ko){word-break:keep-all}
</style>
</head>
<body>

<!-- Connect gate (shown until connected) -->
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-brand"><span class="logo" aria-hidden="true">🐦</span>
      <div><div class="gt" data-i18n="app.title">Shorebird 콘솔</div>
        <div class="gs" data-i18n="gate.subtitle">셀프 호스팅 코드 푸시 컨트롤 플레인</div></div>
    </div>
    <div class="field"><label for="base" data-i18n="gate.base">서버 기본 URL</label>
      <input id="base" placeholder="(비워 두면 동일 출처)" data-i18n-attr="placeholder:gate.basePh" autocomplete="off"></div>
    <div class="field"><label for="key" data-i18n="gate.key">API 키</label>
      <input id="key" type="password" placeholder="sb_api_… 또는 부트스트랩 키" data-i18n-attr="placeholder:gate.keyPh" autocomplete="off"></div>
    <button class="primary block" id="connectBtn" data-i18n="gate.connect">연결</button>
    <div id="connError"></div>
    <div class="gate-foot">
      <div class="status" id="status"><span class="led"></span><span id="statusText">연결 안 됨</span></div>
      <div class="side-actions">
        <button id="langBtn" class="sm" lang="en" title="Switch to English" data-i18n="lang.btn" data-i18n-attr="title:lang.title;lang:lang.target">English</button>
        <button id="themeBtn" class="sm" title="테마 전환" data-i18n="theme.btn" data-i18n-attr="title:theme.title">테마</button>
      </div>
    </div>
  </div>
</div>

<!-- App shell (revealed on connect) -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="side-top">
      <div class="brand"><span class="logo" aria-hidden="true">🐦</span> Shorebird</div>
      <div class="conn"><span class="led ok"></span><span id="connHost">연결됨</span></div>
      <div class="side-actions">
        <button class="sm" id="themeBtn2" title="테마 전환" data-i18n="theme.btn" data-i18n-attr="title:theme.title">테마</button>
        <button class="sm" id="langBtn2" lang="en" title="Switch to English" data-i18n="lang.btn" data-i18n-attr="title:lang.title;lang:lang.target">English</button>
        <button class="sm" id="disconnectBtn" data-i18n="side.disconnect">연결 해제</button>
      </div>
    </div>

  };
  const LANGS = Object.keys(I18N);
  let lang = (function(){
    let saved=null;
    try{ saved=localStorage.getItem(LS.lang); }catch(e){}
    return LANGS.includes(saved) ? saved : "ko";
  })();

  // Looks a key up in the active language, falling back to English and then
  // to the key itself so a missing entry shows up rather than blanking out.
  function t(key, vars){
    let v=I18N[lang][key];
    if(v===undefined) v=I18N.en[key];
    if(v===undefined) return key;
    if(typeof v==="function") return v(vars||{});
    if(typeof v!=="string" || !vars) return v;
    return v.replace(/\{(\w+)\}/g,(m,k)=>vars[k]===undefined?m:String(vars[k]));
  }
  // Display label for a value the server owns (a role or a status name):
  // translated when the dictionary knows it, otherwise shown as sent.
  function serverLabel(prefix, value){
    const k=prefix+"."+value;
    return (I18N[lang][k]!==undefined || I18N.en[k]!==undefined) ? t(k) : String(value==null?"":value);
  }
  function roleLabel(r){ return serverLabel("role", r); }
  function statusLabel(s){ return serverLabel("state", s); }
  function locale(){ return lang==="ko" ? "ko-KR" : "en-US"; }

  const state = {
    base: localStorage.getItem(LS.base) || "",
    key: localStorage.getItem(LS.key) || "",
    orgs: [],
    apps: [],
    selected: null,    // app object
    selectedOrg: null, // org id (team view)
    selectedOrgRole: null,
    me: null,          // current user {user_id,email}
    appFilter: "",     // sidebar app filter text
    tab: "overview",   // active app-detail tab
    appData: null,     // cached data for the selected app
    teamView: null,    // last fetched org team view (see drawTeam)
  };

  // Must match Api._roles. The server rejects anything else with a 400, and
  // authorization matches these exact strings — a role it doesn't know reads
  // as "no privileges", so offering one here would just create dead members.
  const ROLES = ["owner","admin","developer"];
  // The seeded org (Repository._seed). Being an owner/admin of it is what the
  // server treats as being an operator of this deployment.
  const ROOT_ORG_ID = 1;

  // ---------- utils ----------
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,c=>(
      {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }
  function num(n){ return (n==null||n==="")?"—":Number(n).toLocaleString(locale()); }
  function fmtBytes(n){
    n=Number(n)||0;
    if(n<1024) return n+" B";
    const u=["KB","MB","GB"]; let i=-1;
    do{ n/=1024; i++; }while(n>=1024 && i<u.length-1);
    return n.toFixed(n<10?1:0)+" "+u[i];
  }
  function relTime(iso){
    if(!iso) return "";
    const ms=Date.parse(String(iso));
    if(isNaN(ms)) return String(iso).slice(0,19).replace("T"," ");
    const s=Math.floor((Date.now()-ms)/1000);
    if(s<0) return t("time.justNow");
    if(s<60) return t("time.justNow");
    const m=Math.floor(s/60); if(m<60) return t("time.min",{n:m});
    const h=Math.floor(m/60); if(h<24) return t("time.hour",{n:h});
    const d=Math.floor(h/24); if(d<30) return t("time.day",{n:d});
    return new Date(ms).toISOString().slice(0,10);
  }
  function toast(msg, kind){
    const el=document.createElement("div");
    el.className=kind||"";
    el.textContent=msg;
    $("toast").appendChild(el);
    setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300);}, 3800);
  }
  // Status is kept as a key (not rendered text) so a language switch can
  // redraw it.
  let lastStatus={cls:"", key:"conn.notConnected", vars:null};
  function setStatus(cls, key, vars){
    lastStatus={cls:cls||"", key, vars:vars||null};
    const s=$("status"); s.className="status "+lastStatus.cls;
    $("statusText").textContent=t(key, vars);
  }

  // Static markup carries data-i18n (text) and data-i18n-attr
  // ("attr:key;attr:key") hooks; this fills them for the active language.
  function applyStaticI18n(){
    document.documentElement.lang=lang;
    document.title=t("app.title");
    const md=document.querySelector('meta[name="description"]');
    if(md) md.setAttribute("content", t("app.description"));
    document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-attr]").forEach(el=>{
      el.getAttribute("data-i18n-attr").split(";").forEach(pair=>{
        const i=pair.indexOf(":");
        if(i>0) el.setAttribute(pair.slice(0,i).trim(), t(pair.slice(i+1).trim()));
      });
    });
  }

  // ---------- API ----------
  function apiUrl(path){
    let base=(state.base||"").replace(/\/+$/,"");
    return base + path;
  }
  async function api(method, path, opts){
    opts=opts||{};
    const headers={};
    if(state.key) headers["Authorization"]="Bearer "+state.key;
    let body;
    if(opts.json!==undefined){ headers["Content-Type"]="application/json"; body=JSON.stringify(opts.json); }
    let res;
    try{ res=await fetch(apiUrl(path), {method, headers, body}); }
    catch(e){
      // fetch only rejects when no response arrived (bad URL, CORS, server
      // down), and its message is the browser's own English text. Flag it so
      // the UI can say so in the active language (see errMsg).
      const err=new Error((e&&e.message)||"network error"); err.network=true;
      throw err;
    }
    const ct=res.headers.get("content-type")||"";
    let data=null, text=null;
    if(ct.includes("application/json")){ try{ data=await res.json(); }catch(e){ data=null; } }
    else { try{ text=await res.text(); }catch(e){} }
    if(!res.ok){
      const err=new Error((data&&(data.message||data.code))||text||("HTTP "+res.status));
      err.status=res.status; err.data=data;
      throw err;
    }
    return data!==null?data:text;
  }
  // Returns {ok, data, status} instead of throwing — for optional endpoints.
  async function tryApi(method, path, opts){
    try{ return {ok:true, data:await api(method,path,opts)}; }
    catch(e){ return {ok:false, status:e.status, error:e}; }
  }
  // Message for an api()/tryApi() error: the server's text as sent, or a
  // translated one when the request never reached the server.
  function errMsg(e){ return e&&e.network ? t("conn.unreachable") : ((e&&e.message)||""); }

  // ---------- render: app list ----------
  // Shared keyboard handler for sidebar lists: Enter/Space activates,
  // ArrowUp/Down moves focus between items.
  function listKeydown(e, onActivate){
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onActivate(); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); const n=e.currentTarget.nextElementSibling; if(n&&n.matches("li")) n.focus(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); const p=e.currentTarget.previousElementSibling; if(p&&p.matches("li")) p.focus(); }
  }

  function renderApps(){
    const ul=$("appList");
    ul.innerHTML="";
    $("appCount").textContent=state.apps.length;
    $("appsEmpty").style.display=state.apps.length?"none":"block";
    $("appFilter").hidden = state.apps.length<2;
    const f=(state.appFilter||"").trim().toLowerCase();
    const apps=f
      ? state.apps.filter(a=>((a.display_name||"")+" "+a.app_id).toLowerCase().includes(f))
      : state.apps;
    if(f && !apps.length){
      const li=document.createElement("li");
      li.className="empty"; li.style.cursor="default";
      li.textContent=t("apps.noMatch",{q:state.appFilter});
      ul.appendChild(li); return;
    }
    apps.forEach(a=>{
      const li=document.createElement("li");
      li.tabIndex=0; li.setAttribute("role","button");
      if(state.selected && state.selected.app_id===a.app_id) li.className="active";
      const plats=(a.platforms||[]).map(p=>`<span class="pill">${esc(p)}</span>`).join(" ");
      li.innerHTML=`<div class="name">${esc(a.display_name||a.app_id)}</div>`+
        `<div class="meta">${t("apps.meta_html",{rel:esc(a.latest_release_version||"—"), patch:a.latest_patch_number==null?"—":esc(a.latest_patch_number)})}</div>`+
        (plats?`<div class="chips" style="margin-top:.3rem">${plats}</div>`:"");
      li.onclick=()=>selectApp(a);
      li.onkeydown=(e)=>listKeydown(e,()=>selectApp(a));
      ul.appendChild(li);
    });
  }

  let creatingApp=false; // a create request is in flight (see createApp)
  function renderOrgs(){
    const sel=$("orgSelect");
    const prev=sel.value;
    sel.innerHTML="";
    if(!state.orgs.length){
      sel.innerHTML=`<option value="">${esc(t("orgs.none"))}</option>`;
      $("createAppBtn").disabled=true;
      return;
    }
    state.orgs.forEach(o=>{
      const org=o.organization||o;
      const opt=document.createElement("option");
      opt.value=org.id;
      opt.textContent=(org.name||t("orgs.fallback",{id:org.id}))+(o.role?"  ("+roleLabel(o.role)+")":"");
      sel.appendChild(opt);
    });
    if(prev && [...sel.options].some(o=>o.value===prev)) sel.value=prev;
    $("createAppBtn").disabled=creatingApp;
  }

  // ---------- team management ----------
  function renderTeamOrgs(){
    const ul=$("orgList"); ul.innerHTML="";
    const empty=$("orgsEmpty");
    if(!state.orgs.length){ empty.style.display="block"; return; }
    empty.style.display="none";
    state.orgs.forEach(o=>{
      const org=o.organization||o; const role=o.role||"member";
      const li=document.createElement("li");
      li.tabIndex=0; li.setAttribute("role","button");
      if(state.selectedOrg===org.id) li.className="active";
      li.innerHTML=`<div class="name">${esc(org.name||t("orgs.fallback",{id:org.id}))}</div><div class="meta">${esc(roleLabel(role))}</div>`;
      const open=()=>selectOrg(org.id, org.name||t("orgs.fallback",{id:org.id}), role);
      li.onclick=open;
      li.onkeydown=(e)=>listKeydown(e,open);
      ul.appendChild(li);
    });
  }
  function orgName(orgId){ const o=state.orgs.map(x=>x.organization||x).find(x=>x.id===orgId); return (o&&o.name)||t("orgs.fallback",{id:orgId}); }
  // Option values stay the server's role names; only the visible label is
  // translated.
  function roleOptions(selected){
    return ROLES.map(r=>`<option value="${r}"${r===selected?" selected":""}>${esc(roleLabel(r))}</option>`).join("");
  }
  function roleSelect(userId, role){
    return `<select data-role-user="${userId}">`+roleOptions(role)+`</select>`;
  }
  function okBox(html){ return `<div style="margin-top:.5rem;padding:.5rem .6rem;border:1px solid var(--line,#ccc);border-radius:8px;font-size:12px">${html}</div>`; }

  async function selectOrg(orgId, name, role){
    state.selectedOrg=orgId; state.selectedOrgRole=role; state.selected=null;
    renderApps(); renderTeamOrgs();
    const d=$("detail");
    d.innerHTML=skeletonDetail();
    const isAdmin = role==="owner"||role==="admin";
    const [mRes,iRes,dRes]=await Promise.all([
      tryApi("GET","/admin/orgs/"+orgId+"/members"),
      isAdmin?tryApi("GET","/admin/orgs/"+orgId+"/invitations"):Promise.resolve({ok:false,status:403}),
      isAdmin?tryApi("GET","/admin/orgs/"+orgId+"/domains"):Promise.resolve({ok:false,status:403})
    ]);
    // Another org or an app was opened while this was loading; it owns
    // #detail now.
    if(state.selectedOrg!==orgId || state.selected) return;
    const members=mRes.ok?((mRes.data&&mRes.data.members)||[]):[];
    const invites=iRes.ok?((iRes.data&&iRes.data.invitations)||[]):[];
    const domains=dRes.ok?((dRes.data&&dRes.data.domains)||[]):[];
    state.teamView={orgId,role,isAdmin,members,invites,mRes,domains};
    drawTeam();
  }
  // Draws the team view from the last fetch, so a language switch can redraw
  // it without a reload.
  function drawTeam(){
    const v=state.teamView;
    $("detail").innerHTML=renderTeam(v.orgId,orgName(v.orgId),v.role,v.isAdmin,v.members,v.invites,v.mRes,v.domains);
    wireTeam(v.orgId,v.isAdmin);
  }

  function renderTeam(orgId,name,role,isAdmin,members,invites,mRes,domains){
    const meId=state.me&&state.me.user_id;
    let h=`<div class="panel"><div class="hd"><span>${t("team.title_html",{name:esc(name)})}</span><span class="pill">${esc(roleLabel(role))}</span></div><div class="bd">`;
    if(!isAdmin) h+=`<div class="empty" style="margin-bottom:.6rem">${t("team.viewOnly_html",{role:esc(roleLabel(role))})}</div>`;
    if(!mRes.ok){ h+=`<div class="empty">${esc(t("team.membersUnavailable",{status:mRes.status||"?"}))}</div>`; }
    else {
      h+=`<table><thead><tr><th>${esc(t("field.member"))}</th><th>${esc(t("field.role"))}</th>${isAdmin?"<th></th>":""}</tr></thead><tbody>`;
      members.forEach(m=>{
        const you=m.user_id===meId?` <span class="pill">${esc(t("common.you"))}</span>`:'';
        h+=`<tr><td>${esc(m.email)}${you}${m.display_name?`<div class="meta">${esc(m.display_name)}</div>`:""}</td>`+
           `<td>${isAdmin?roleSelect(m.user_id,m.role):esc(roleLabel(m.role))}</td>`+
           (isAdmin?`<td><button data-remove-member="${m.user_id}">${esc(t("common.remove"))}</button></td>`:"")+`</tr>`;
      });
      h+=`</tbody></table>`;
    }
    h+=`</div></div>`;
    if(isAdmin){
      h+=`<div class="section"><div class="panel"><div class="hd">${esc(t("team.invite"))}</div><div class="bd">`+
         `<div class="field" style="margin-bottom:.5rem"><label for="invEmail">${esc(t("field.email"))}</label><input id="invEmail" placeholder="teammate@company.com"></div>`+
         `<div class="field" style="margin-bottom:.5rem"><label for="invRole">${esc(t("field.role"))}</label><select id="invRole">${roleOptions("developer")}</select></div>`+
         `<button class="primary" id="inviteBtn">${esc(t("team.sendInvite"))}</button><div id="inviteOut"></div></div></div></div>`;
      // Domain allowlist: governs who can be *added* from now on (invitations
      // and app collaborators). Existing members are never evicted by it.
      const dl=(domains||[]).join(", ");
      h+=`<div class="section"><div class="panel"><div class="hd">`+
         `<span>${esc(t("dom.title"))}</span>`+
         `<span class="pill${dl?" active":""}">${esc(t(dl?"dom.restricted":"dom.unrestricted"))}</span></div><div class="bd">`+
         `<div class="field" style="margin-bottom:.5rem"><label for="domList">${esc(t("dom.label"))}</label>`+
         `<input id="domList" placeholder="company.com, company.co.uk" value="${esc(dl)}"></div>`+
         `<div class="muted" style="font-size:12.5px;margin-bottom:.5rem">${t("dom.help_html")}</div>`+
         `<button class="primary" id="domSaveBtn">${esc(t("dom.save"))}</button><div id="domOut"></div>`+
         `</div></div></div>`;
      h+=`<div class="section"><div class="panel"><div class="hd">${esc(t("inv.pending"))} <span class="pill">${invites.length}</span></div><div class="bd">`;
      if(!invites.length) h+=`<div class="empty">${esc(t("inv.none"))}</div>`;
      else{
        h+=`<table><thead><tr><th>${esc(t("field.email"))}</th><th>${esc(t("field.role"))}</th><th>${esc(t("field.expires"))}</th><th></th></tr></thead><tbody>`;
        invites.forEach(iv=>{
          const link=`${location.origin}/api/v1/invitations/${iv.token}/accept`;
          h+=`<tr><td>${esc(iv.email)}</td><td>${esc(roleLabel(iv.role))}</td><td class="meta">${esc((iv.expires_at||"").slice(0,10))}</td>`+
             `<td><button data-copy="${esc(link)}">${esc(t("inv.copyLink"))}</button> <button data-revoke="${esc(iv.token)}">${esc(t("inv.revoke"))}</button></td></tr>`;
        });
        h+=`</tbody></table>`;
      }
      h+=`</div></div></div>`;
      // Issuing API keys is operator-only server-side (it returns the existing
      // account on an email conflict, so it can hand out a key for anyone).
      // Only root-org admins can do it, so don't offer the form to anyone else.

    document.querySelectorAll("[data-revoke]").forEach(b=>{ b.onclick=async()=>{ await revokeInvite(orgId,b.getAttribute("data-revoke")); reload(); }; });
    document.querySelectorAll("[data-copy]").forEach(b=>{ b.onclick=()=>{ if(navigator.clipboard) navigator.clipboard.writeText(b.getAttribute("data-copy")); toast(t("toast.inviteCopied"),"ok"); }; });

  // ---------- connect ----------
  async function connect(){
    state.base=$("base").value.trim();
    state.key=$("key").value.trim();
    localStorage.setItem(LS.base, state.base);
    localStorage.setItem(LS.key, state.key);
    setConnError(null);
    if(!state.key){ setStatus("err","conn.noKey"); toast(t("toast.enterKey"),"err"); return; }
    setStatus("busy","conn.connecting");
    try{
      const orgsRes=await tryApi("GET","/api/v1/organizations");
      if(orgsRes.ok){ state.orgs=(orgsRes.data&&orgsRes.data.organizations)||[]; renderOrgs(); }
      const appsData=await api("GET","/api/v1/apps");
      state.apps=(appsData&&appsData.apps)||[];
      renderApps();
      const meRes=await tryApi("GET","/api/v1/users/me");
      if(meRes.ok) state.me=meRes.data;
      renderTeamOrgs();
      setStatus("ok","conn.connected",{n:state.apps.length});
      showApp();
      if(!state.selected && state.selectedOrg==null) renderOverview();
      if(!orgsRes.ok){ toast(t("toast.orgsUnavailable",{status:orgsRes.status||"?"}),""); }
    }catch(e){
      setStatus("err","conn.failed");
      setConnError({message:e.message, status:e.status, network:!!e.network});
    }
  }
  // Kept as data so a language switch on the connect screen can redraw it.
  let lastConnError=null;
  function setConnError(err){
    lastConnError=err;
    $("connError").innerHTML=err
      ? '<div class="err-box">'+t("conn.error_html",{msg:esc(err.network?t("conn.unreachable"):err.message), http:err.status?(" (HTTP "+esc(err.status)+")"):""})+'</div>'
      : "";
  }

  async function createApp(){
    const orgId=$("orgSelect").value;
    const name=$("newAppName").value.trim();
    if(!name){ toast(t("toast.enterName"),"err"); return; }
    const btn=$("createAppBtn"); btn.disabled=true; creatingApp=true;
    try{
      await api("POST","/api/v1/apps",{json:{organization_id:Number(orgId), display_name:name}});

  // ---------- app detail ----------
  async function selectApp(app){
    state.selected=app;
    state.selectedOrg=null;
    state.tab="overview";
    renderApps();
    renderTeamOrgs();
    const d=$("detail");
    d.innerHTML=skeletonDetail();

    const appId=app.app_id;
    const [relRes, chRes, mRes] = await Promise.all([
      tryApi("GET","/api/v1/apps/"+encodeURIComponent(appId)+"/releases"),
      tryApi("GET","/api/v1/apps/"+encodeURIComponent(appId)+"/channels"),
      tryApi("GET","/api/v1/apps/"+encodeURIComponent(appId)+"/metrics"),
    ]);
    // App may have changed while awaiting (user clicked another app).
    if(!state.selected || state.selected.app_id!==appId) return;

    const releases = relRes.ok ? ((relRes.data&&relRes.data.releases)||[]) : [];
    let channels = [];
    if(chRes.ok){ channels = Array.isArray(chRes.data)?chRes.data:((chRes.data&&chRes.data.channels)||[]); }
    const metrics = mRes.ok ? mRes.data : null;

    state.appData = {app, appId, releases, channels, metrics, relRes, mRes};
    mountAppShell();
  }

  async function loadLivePatches(appId, release, channels){
    const box=$("liveBox"); if(!box) return;
    const res=await tryApi("GET","/api/v1/apps/"+encodeURIComponent(appId)+"/releases/"+encodeURIComponent(release.id)+"/patches");
    if(state.tab!=="overview" || !state.selected || state.selected.app_id!==appId) return;
    const lc=$("liveCount");
    if(!res.ok){ box.innerHTML=`<div class="empty">${esc(t("patch.unavailable",{status:res.status||"?"}))}</div>`; if(lc) lc.textContent="—"; return; }
    const patches=(res.data&&res.data.patches)||[];
    const active=patches.filter(p=>(p.deployments||[]).some(d=>d.status==="active" && !d.rolled_back));
    if(lc) lc.textContent=String(active.length);
    if(!active.length){ box.innerHTML=`<div class="empty">${t("ov.noLive_html",{version:esc(release.version)})}</div>`; return; }
    box.innerHTML=`<div class="muted" style="font-size:12px;margin-bottom:.5rem">${t("ov.onLatest_html",{version:esc(release.version)})}</div>`+
      patchCardsHtml(active, channels);
    wirePatchCards(box, appId, release.id, ()=>loadLivePatches(appId, release, channels));
  }

  // Build provenance from the CLI's `metadata` blob: what built this, on what.
  // The shape is upstream's to change, so read the handful of fields worth
  // showing and fall back to the raw JSON for everything else rather than
  // pretending to understand it.
  function provenanceHtml(md){
    if(!md || typeof md!=="object" || Array.isArray(md)) return "";
    const env=(md.environment && typeof md.environment==="object")?md.environment:{};
    const bits=[];
    const add=(label,v)=>{ if(v!==undefined && v!==null && v!=="") bits.push(`<span>${label}: <b>${esc(String(v))}</b></span>`); };
    add("shorebird", env.shorebird_version);
    add("flutter", md.flutter_version_override || env.flutter_revision);
    add("os", env.operating_system_version || env.operating_system);
    add("xcode", env.xcode_version);
    if(md.release_platform) add(esc(t("prov.platform")), md.release_platform);
    let h=`<details class="prov" style="margin-top:.4rem"><summary class="muted" style="font-size:12.5px">${esc(t("prov.title"))}</summary>`;
    if(bits.length) h+=`<div class="kv" style="margin-top:.35rem">${bits.join("")}</div>`;
    h+=`<pre style="margin:.4rem 0 0;overflow-x:auto;font-size:11.5px">${esc(JSON.stringify(md,null,2))}</pre>`;
    return h+`</details>`;
  }

  // Promise-based confirm modal (replaces window.confirm). body may contain HTML.
  function confirmModal(opts){
    return new Promise(resolve=>{
      const bd=document.createElement("div");
      bd.className="modal-backdrop";
      const title=opts.title||t("common.confirm");
      bd.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">`+
        `<h3>${esc(title)}</h3><p>${opts.body||""}</p>`+
        `<div class="actions"><button class="cancel">${esc(t("common.cancel"))}</button>`+
        `<button class="${opts.danger?"danger":"primary"} ok">${esc(opts.confirm||t("common.confirm"))}</button></div></div>`;
      document.body.appendChild(bd);
      const prevFocus=document.activeElement;
      const cancel=bd.querySelector(".cancel"), ok=bd.querySelector(".ok");
      const done=(v)=>{
        bd.remove(); document.removeEventListener("keydown",onKey);
        try{ if(prevFocus&&prevFocus.focus) prevFocus.focus(); }catch(e){}
        resolve(v);
      };
      const onKey=(e)=>{
        if(e.key==="Escape"){ e.preventDefault(); done(false); }
        else if(e.key==="Enter"){ e.preventDefault(); done(true); }
        else if(e.key==="Tab"){ e.preventDefault(); (document.activeElement===ok?cancel:ok).focus(); } // trap
      };
      document.addEventListener("keydown",onKey);
      cancel.onclick=()=>done(false);
      ok.onclick=()=>done(true);
      bd.addEventListener("click",e=>{ if(e.target===bd) done(false); });
      ok.focus();
    });
  }

  // App-detail content is rendered per-tab by renderOverviewTab /
  // renderReleasesTab / renderAnalyticsTab / renderTeamTab (see selectApp).

  async function loadPatches(appId, releaseId, channels){
    const box=document.querySelector('.patches[data-release="'+CSS.escape(releaseId)+'"]');
    if(!box) return;
    box.innerHTML=`<div class="empty">${esc(t("patch.loading"))}</div>`;
    const res=await tryApi("GET","/api/v1/apps/"+encodeURIComponent(appId)+"/releases/"+encodeURIComponent(releaseId)+"/patches");
    if(!res.ok){
      if(res.status===404){ box.innerHTML=`<div class="empty">${esc(t("patch.none"))}</div>`; }
      else { box.innerHTML=`<div class="err-box">${esc(t("patch.unavailable",{status:res.status||"?"}))}</div>`; }
      return;
    }
    const patches=(res.data&&res.data.patches)||[];
    if(!patches.length){ box.innerHTML=`<div class="empty">${esc(t("patch.none"))}</div>`; return; }
    box.innerHTML=patchCardsHtml(patches, channels);
    wirePatchCards(box, appId, releaseId, ()=>loadPatches(appId, releaseId, channels));
  }

  // Builds the per-patch cards (deployment state + rollout/withdraw controls).
  function patchCardsHtml(patches, channels){
    const opts=channelOptions(channels);
    let h="";
    // newest patch first — a timeline of deployment state
    patches.slice().reverse().forEach(p=>{
      const pid=p.id;
      const deploys=p.deployments||[];
      const active=deploys.find(d=>d.status==="active" && !d.rolled_back);
      const rolledBack=p.is_rolled_back || deploys.some(d=>d.rolled_back);
      const curPct=active?active.rollout:100;
      // headline state pill
      let state;
      if(rolledBack) state=`<span class="pill draft">${esc(t("patch.rolledBack"))}</span>`;
      else if(active) state=`<span class="pill active">${t("patch.live_html",{channel:esc(active.channel), pct:esc(active.rollout)})}</span>`;
      else if(deploys.length) state=`<span class="pill">${esc(t("patch.withdrawn"))}</span>`;
      else state=statusPill(p.status||"ready");
      h+=`<div class="card"><div class="title">${t("patch.title_html",{n:esc(p.number)})} ${state}</div>`;
      // breakdown — what this patch actually is: built artifacts, size, build status, notes
      const arts=p.artifacts||[];
      const totalSize=arts.reduce((s,a)=>s+(Number(a.size)||0),0);
      // A patch is not platform-scoped: `shorebird patch --platforms=android,ios`
      // publishes ONE patch carrying artifacts for both. Summarize the platform
      // set here — the per-artifact chips below are per arch, so a 3-arch
      // android + ios patch is 4 chips you'd otherwise have to read to answer
      // "what does this patch cover?".
      const plats=[...new Set(arts.map(a=>a.platform).filter(Boolean))].sort();
      h+=`<div class="kv" style="margin-top:.2rem">`+
         (plats.length?`<span>${plats.map(esc).join(" + ")}</span>`:"")+
         `<span>${esc(t("patch.artifacts",{n:arts.length}))}</span>`+
         (totalSize?`<span>${esc(fmtBytes(totalSize))}</span>`:"")+
         (p.status?`<span>${t("patch.build_html",{status:esc(statusLabel(p.status))})}</span>`:"")+`</div>`;
      if(arts.length){
        h+=`<div class="chips" style="margin-top:.5rem">`+
           arts.map(a=>{
             const label=`${esc(a.platform||"?")}${a.arch?" · "+esc(a.arch):""}${a.size?" · "+esc(fmtBytes(a.size)):""}`;
             const tip=a.hash?`SHA-256 ${esc(String(a.hash))}`:"";
             return `<span class="pill"${tip?` title="${tip}"`:""}>${label}</span>`;
           }).join("")+`</div>`;
      }
      h+=provenanceHtml(p.metadata);
      // Notes: shown when set, and always editable inline. Freeform "why did
      // this patch ship" text — the field the CLI's `patches info` prints.
      h+=`<div class="notes" data-patch="${esc(pid)}" style="margin-top:.5rem">`+
         `<input type="text" class="nt" maxlength="4096" placeholder="${esc(t("patch.notesPh"))}" value="${esc(p.notes||"")}" style="flex:1;min-width:12rem">`+
         `<button class="sm act-notes">${esc(t("patch.saveNotes"))}</button>`+
         `</div>`;
      // per-channel deployment rows with rollout bars
      if(deploys.length){
        h+=`<div class="deploys">`;
        deploys.forEach(d=>{
          const label=d.rolled_back?t("patch.rolledBack"):statusLabel(d.status);
          const cls=d.rolled_back?"draft":(d.status==="active"?"active":"");
          h+=`<div class="deploy"><span class="dch">${esc(d.channel)}</span>`+
             `<span class="pill ${cls}">${esc(label)}</span>`+rolloutBar(d.rollout)+`</div>`;
        });
        h+=`</div>`;
      }
      // rollout control (slider pre-set to the current active rollout)
      h+=`<div class="rollout" data-patch="${esc(pid)}">`+
         `<label style="margin:0">${esc(t("patch.channel"))}</label><select class="ch">${opts}</select>`+
         `<input type="range" class="rg" min="0" max="100" value="${curPct}">`+
         `<input type="number" class="pct" min="0" max="100" value="${curPct}"> %`+
         `<button class="sm primary act-rollout">${esc(t("patch.setRollout"))}</button>`+
         `</div>`;
      h+=`<div class="row" style="margin-top:.5rem">`+
         `<button class="sm danger act-withdraw" data-rollback="false">${esc(t("patch.withdraw"))}</button>`+
         `<button class="sm danger act-withdraw" data-rollback="true">${esc(t("patch.withdrawRollback"))}</button>`+
         `</div>`;
      h+=`</div>`;
    });
    return h;
  }

  // Wires the rollout sliders + withdraw buttons produced by patchCardsHtml.
  // `reload` re-fetches and re-renders the container after a state change.
  function wirePatchCards(box, appId, releaseId, reload){
    box.querySelectorAll('.rollout').forEach(rc=>{
      const pid=rc.dataset.patch;
      const rg=rc.querySelector('.rg'), pct=rc.querySelector('.pct');
      const setFill=()=>rg.style.setProperty('--fill', Math.max(0,Math.min(100,Number(rg.value)||0))+'%');
      setFill();
      rg.addEventListener('input',()=>{pct.value=rg.value; setFill();});
      pct.addEventListener('input',()=>{let v=Math.max(0,Math.min(100,Number(pct.value)||0));rg.value=v; setFill();});
      rc.querySelector('.act-rollout').onclick=()=>{
        const ch=rc.querySelector('.ch').value;
        const percent=Math.max(0,Math.min(100,Number(pct.value)||0));
        doRollout(appId, pid, ch, percent, reload);
      };
    });
    box.querySelectorAll('.notes').forEach(nc=>{
      const pid=nc.dataset.patch;
      const input=nc.querySelector('.nt');
      const save=()=>doSetPatchNotes(appId, pid, input.value, reload);
      nc.querySelector('.act-notes').onclick=save;
      // Enter saves, so the common case is type-and-go.
      input.addEventListener('keydown',e=>{ if(e.key==="Enter"){ e.preventDefault(); save(); }});
    });
    box.querySelectorAll('.card').forEach(card=>{
      const rc=card.querySelector('.rollout');
      const pid=rc?rc.dataset.patch:null;
      card.querySelectorAll('.act-withdraw').forEach(btn=>{
        btn.onclick=()=>{
          const rollback=btn.dataset.rollback==="true";
          const ch=rc.querySelector('.ch').value;
          doWithdraw(appId, pid, ch, rollback, reload);
        };
      });
    });
  }

  // An empty string is the documented "clear the notes" signal, so a blank box
  // saves as cleared rather than being rejected client-side.
  async function doSetPatchNotes(appId, patchId, notes, reload){
    const res=await tryApi("PATCH","/api/v1/apps/"+encodeURIComponent(appId)+"/patches/"+encodeURIComponent(patchId),{json:{notes:String(notes==null?"":notes)}});
    if(res.ok){ toast(t(String(notes).trim()?"toast.notesSaved":"toast.notesCleared"),"ok"); if(reload) reload(); }
    else toast(t("toast.notesFailed",{msg:res.error?errMsg(res.error):res.status}),"err");
  }

  async function doRollout(appId, patchId, channel, percent, reload){
    const q="?channel="+encodeURIComponent(channel)+"&percent="+encodeURIComponent(percent);
    const res=await tryApi("POST","/admin/apps/"+encodeURIComponent(appId)+"/patches/"+encodeURIComponent(patchId)+"/rollout"+q);
    if(res.ok){ toast(t("toast.rolloutSet",{pct:percent, channel}),"ok"); if(reload) reload(); }
    else toast(t("toast.rolloutFailed",{msg:res.error?errMsg(res.error):res.status}),"err");
  }

  async function doWithdraw(appId, patchId, channel, rollback, reload){
    const ok=await confirmModal({
      title: t(rollback?"wd.titleRollback":"wd.title"),
      body: t(rollback?"wd.bodyRollback_html":"wd.body_html",{channel:esc(channel)}),
      confirm: t(rollback?"patch.withdrawRollback":"patch.withdraw"),
      danger:true,
    });
    if(!ok) return;
    const q="?channel="+encodeURIComponent(channel)+"&rollback="+(rollback?"true":"false");
    const res=await tryApi("POST","/admin/apps/"+encodeURIComponent(appId)+"/patches/"+encodeURIComponent(patchId)+"/withdraw"+q);
    if(res.ok){ toast(t(rollback?"toast.withdrawnRollback":"toast.withdrawn",{channel}),"ok"); if(reload) reload(); }
    else toast(t("toast.withdrawFailed",{msg:res.error?errMsg(res.error):res.status}),"err");
  }

  // ---------- analytics helpers ----------
  function pad2(n){ return String(n).padStart(2,"0"); }
  // Categorical hue order for multi-series charts (fixed order, never cycled
  // beyond the list — extra series are dropped rather than repainted).
  const CAT=["var(--accent)","var(--ok)","var(--warn)","var(--danger)","var(--bar2)"];

  // Trims an ISO-ish period string to just the calendar date for axis labels.
  function shortPeriod(v){ return String(v==null?"":v).slice(0,10); }

  // Inline SVG multi-series line/area chart.
  //   datasets: [{label, color, values:[{label, value}]}]  (x shared by index)
  //   opts: {area, max, fmtY, unit}
  function lineChart(datasets, opts){
    opts=opts||{};
    const clean=(datasets||[]).filter(d=>d.values && d.values.length);
    if(!clean.length) return `<div class="empty">${esc(t("chart.noData"))}</div>`;
    const n=Math.max.apply(null, clean.map(d=>d.values.length));
    const W=Math.max(320, n*40+64), H=200, padL=46, padR=12, padT=12, padB=32;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    let max=opts.max!=null?opts.max:0;
    if(opts.max==null){ clean.forEach(d=>d.values.forEach(p=>{max=Math.max(max, Number(p.value)||0);})); }
    if(max<=0) max=1;
    const fmtY=opts.fmtY||(v=>num(Math.round(v)));
    const xLabels=clean[0].values.map(p=>p.label);
    const X=i=> n<=1 ? padL+plotW/2 : padL + plotW*i/(n-1);
    const Y=v=> padT+plotH - plotH*(Math.min(Number(v)||0,max)/max);
    let axis="";
    for(let i=0;i<=4;i++){
      const val=max*i/4, y=padT+plotH-plotH*i/4;
      axis+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
      axis+=`<text x="${padL-6}" y="${y+3}" text-anchor="end">${esc(fmtY(val))}</text>`;
    }
    let xax="";
    const step=Math.max(1, Math.ceil(n/6));
    xLabels.forEach((lb,i)=>{ if(i%step===0 || i===n-1){
      xax+=`<text x="${X(i).toFixed(1)}" y="${H-padB+16}" text-anchor="middle">${esc(shortPeriod(lb))}</text>`;
    }});
    let paths="";
    clean.forEach(d=>{
      const line=d.values.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.value).toFixed(1)).join(" ");
      if(opts.area && clean.length===1){
        const base=(padT+plotH).toFixed(1);
        const area="M"+X(0).toFixed(1)+" "+base+" "+
          d.values.map((p,i)=>"L"+X(i).toFixed(1)+" "+Y(p.value).toFixed(1)).join(" ")+
          " L"+X(d.values.length-1).toFixed(1)+" "+base+" Z";
        paths+=`<path d="${area}" fill="${d.color}" opacity="0.14"/>`;
      }
      paths+=`<path d="${line}" fill="none" stroke="${d.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      d.values.forEach((p,i)=>{
        paths+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="2.6" fill="${d.color}"><title>${esc(shortPeriod(p.label))}: ${esc(fmtY(p.value))}</title></circle>`;
      });
    });
    const leg=clean.length>1
      ? `<div class="legend">`+clean.map(d=>`<span><i class="swatch" style="background:${d.color}"></i>${esc(d.label)}</span>`).join("")+`</div>`
      : "";
    return leg+`<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${axis}${xax}${paths}</svg></div>`;
  }

  // Horizontal bar chart. rows: [{label, value, pct}] (pct 0..1 optional).
  function hbarChart(rows, opts){
    opts=opts||{};
    if(!rows||!rows.length) return `<div class="empty">${esc(t("chart.noData"))}</div>`;
    const rowH=26, padT=6, padB=6, labelW=118, W=560;
    const H=padT+padB+rows.length*rowH;
    const barMax=W-labelW-72;
    let max=0; rows.forEach(r=>max=Math.max(max, Number(r.value)||0)); if(max<=0) max=1;
    const color=opts.color||"var(--bar1)";
    let h="";
    rows.forEach((r,i)=>{
      const y=padT+i*rowH, val=Number(r.value)||0, bw=barMax*(val/max);
      const rt=r.pct!=null ? (r.pct*100).toFixed(1)+"%" : num(val);
      h+=`<text x="0" y="${y+rowH/2+4}">${esc(String(r.label).slice(0,18))}</text>`;
      h+=`<rect x="${labelW}" y="${y+4}" width="${Math.max(2,bw).toFixed(1)}" height="${rowH-10}" rx="3" fill="${color}"><title>${esc(r.label)}: ${num(val)}${r.pct!=null?" ("+(r.pct*100).toFixed(1)+"%)":""}</title></rect>`;
      h+=`<text x="${W-2}" y="${y+rowH/2+4}" text-anchor="end" style="fill:var(--text)">${esc(rt)}</text>`;
    });
    return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${h}</svg></div>`;
  }

  // 7x24 sequential heatmap. cells: [{day_of_week_utc(1-7,1=Sun),hour_utc,average_active_devices}].
  function heatmapGrid(cells, busiestDow, busiestHour){
    if(!cells||!cells.length) return `<div class="empty">${esc(t("chart.noData"))}</div>`;
    const days=t("chart.days");
    let max=0; cells.forEach(c=>max=Math.max(max, Number(c.average_active_devices)||0));
    if(max<=0) return `<div class="empty">${esc(t("chart.noActivity"))}</div>`;
    const grid={};
    cells.forEach(c=>{ (grid[c.day_of_week_utc]=grid[c.day_of_week_utc]||{})[c.hour_utc]=Number(c.average_active_devices)||0; });
    const cell=16, gap=2, labelW=34, topH=16;
    const W=labelW+24*(cell+gap), H=topH+7*(cell+gap)+4;
    let h="";
    for(let hr=0;hr<24;hr+=3){
      h+=`<text x="${labelW+hr*(cell+gap)+cell/2}" y="${topH-4}" text-anchor="middle" style="font-size:9px">${hr}</text>`;
    }
    for(let d=1;d<=7;d++){
      const y=topH+(d-1)*(cell+gap);
      h+=`<text x="${labelW-6}" y="${y+cell/2+3}" text-anchor="end" style="font-size:9px">${days[d-1]}</text>`;
      for(let hr=0;hr<24;hr++){
        const v=(grid[d]&&grid[d][hr])||0;
        const x=labelW+hr*(cell+gap);
        const op=0.06+0.94*(v/max);
        const busy=(busiestDow===d && busiestHour===hr);
        h+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="var(--accent)" fill-opacity="${op.toFixed(3)}" stroke="${busy?'var(--text)':'var(--border)'}" stroke-width="${busy?1.5:0.5}"><title>${esc(t("chart.heatTip",{day:days[d-1], hh:pad2(hr), v:v.toFixed(2)}))}</title></rect>`;
      }
    }
    return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${h}</svg></div>`;
  }

  // 24-bar hour-of-day chart with recommended-window / busiest-hour highlights.
  function activeHoursChart(hourly, recStart, recLen, busiest){
    if(!hourly||!hourly.length) return `<div class="empty">${esc(t("chart.noData"))}</div>`;
    const W=Math.max(360, 24*22+50), H=200, padL=44, padR=10, padT=12, padB=28;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    let max=0; hourly.forEach(x=>max=Math.max(max, Number(x.average_active_devices)||0)); if(max<=0) max=1;
    const bw=plotW/24;
    let axis="";
    for(let i=0;i<=4;i++){
      const val=max*i/4, y=padT+plotH-plotH*i/4;
      axis+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
      axis+=`<text x="${padL-6}" y="${y+3}" text-anchor="end">${(val).toFixed(max<4?1:0)}</text>`;
    }
    const recSet={};
    if(recStart!=null){ for(let o=0;o<(recLen||0);o++) recSet[(recStart+o)%24]=1; }
    let bars="", labels="";
    for(let hr=0;hr<24;hr++){
      const v=Number((hourly[hr]||{}).average_active_devices)||0;
      const hh=plotH*(v/max), x=padL+hr*bw, y=padT+plotH-hh;
      const isRec=recSet[hr]===1, isBusy=(busiest===hr);
      const color=isBusy?"var(--warn)":(isRec?"var(--ok)":"var(--bar2)");
      bars+=`<rect x="${(x+2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${color}"><title>${esc(t("chart.hourTip",{hh:pad2(hr), v:v.toFixed(2)})+(isRec?t("chart.hourTipRec"):"")+(isBusy?t("chart.hourTipBusy"):""))}</title></rect>`;
      if(hr%3===0) labels+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+15}" text-anchor="middle">${hr}</text>`;
    }
    const leg=`<div class="legend"><span><i class="swatch" style="background:var(--ok)"></i>${esc(t("chart.recWindow"))}</span><span><i class="swatch" style="background:var(--warn)"></i>${esc(t("chart.busiest"))}</span></div>`;
    return leg+`<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto" role="img">${axis}${bars}${labels}</svg></div>`;
  }

  // current vs previous stat comparison (previous may be null).
  function statCompare(cur, prev, curLabel, prevLabel){
    let h=`<div class="stats">`;
    h+=`<div class="stat"><span class="n">${num(cur)}</span><span class="l">${esc(curLabel||t("stat.current"))}</span></div>`;
    if(prev==null){
      h+=`<div class="stat"><span class="n">—</span><span class="l">${esc(prevLabel||t("stat.previous"))}</span></div>`;
    } else {
      h+=`<div class="stat"><span class="n">${num(prev)}</span><span class="l">${esc(prevLabel||t("stat.previous"))}</span></div>`;
      const c=Number(cur)||0, p=Number(prev)||0;
      let txt, col;
      if(p===0){ txt=c>0?("+"+num(c)):"—"; col=c>0?"var(--ok)":"var(--muted)"; }
      else { const dd=(c-p)/p*100; txt=(dd>=0?"+":"")+dd.toFixed(1)+"%"; col=dd>=0?"var(--ok)":"var(--danger)"; }
      h+=`<div class="stat"><span class="n" style="color:${col}">${esc(txt)}</span><span class="l">${esc(t("stat.change"))}</span></div>`;
    }
    h+=`</div>`;
    return h;
  }

  // ---------- analytics (app-scoped, Bearer-authed) ----------
  function anaCard(title, body){
    return `<div class="panel ana-card"><div class="hd">${esc(title)}</div><div class="bd">${body}</div></div>`;
  }
  function anaNoData(res){
    if(res && !res.ok){
      if(res.status===404) return `<div class="empty">${esc(t("ana.notAvailable"))}</div>`;
      return `<div class="empty">${esc(t("ana.unavailable",{status:(res&&res.status)||"?"}))}</div>`;
    }
    return `<div class="empty">${esc(t("chart.noData"))}</div>`;
  }

  async function loadAnalytics(appId, wrap){
    if(!wrap) return;
    const base="/api/v1/apps/"+encodeURIComponent(appId)+"/analytics/";
    const [adopt,uu,vd,heat,ah,nd,inst,dl]=await Promise.all([
      tryApi("GET",base+"patch-adoption?granularity=day"),
      tryApi("GET",base+"unique-users?window_days=30&granularity=day"),
      tryApi("GET",base+"version-distribution?active_window_days=30"),
      tryApi("GET",base+"activity-heatmap?lookback_days=28"),
      tryApi("GET",base+"active-hours?lookback_days=28"),
      tryApi("GET",base+"new-devices?window_days=30"),
      tryApi("GET",base+"patch-installs?window_days=30&granularity=day"),
      tryApi("GET",base+"patch-downloads?window_days=30&granularity=day"),
    ]);
    // App/tab may have changed while awaiting.
    if(state.tab!=="analytics" || !state.selected || state.selected.app_id!==appId) return;
    let h="";
    h+=anaCard(t("ana.adoption"), renderAdoption(adopt));
    h+=anaCard(t("ana.uniqueUsers"), renderUniqueUsers(uu));
    h+=anaCard(t("ana.versionDist"), renderVersionDist(vd));
    h+=anaCard(t("ana.heatmap"), renderHeatmap(heat));
    h+=anaCard(t("ana.activeHours"), renderActiveHours(ah));
    h+=anaCard(t("ana.newDevices"), renderNewDevices(nd));
    h+=anaCard(t("ana.installs"), renderPatchMetric(inst,"installs"));
    h+=anaCard(t("ana.downloads"), renderPatchMetric(dl,"downloads"));
    wrap.innerHTML=h;
  }

  // GetPatchAdoptionResponse: {release_version,is_latest,granularity,range,as_of,
  //   patches:[{patch_number,target_platforms,is_rolled_back,series:[{period,devices,target,adoption_pct}]}]}
  function renderAdoption(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const patches=(d.patches||[]).slice(0, CAT.length); // cap series to the fixed hue set
    const datasets=[];
    patches.forEach((p,i)=>{
      const series=(p.series||[]).filter(s=>s.period!=null);
      if(!series.length) return;
      datasets.push({
        label:t("ana.patchSeries",{n:p.patch_number}),
        color:CAT[i%CAT.length],
        values:series.map(s=>({label:s.period, value:(Number(s.adoption_pct)||0)*100})),
      });
    });
    if(!datasets.length) return `<div class="empty">${esc(t("ana.noAdoption"))}</div>`;
    const head=`<div class="kv" style="margin-bottom:.5rem"><span>${t("ana.release_html",{v:esc(d.release_version||"—")})}</span>`+
      (d.is_latest?`<span class="pill active">${esc(t("ana.latest"))}</span>`:"")+`</div>`;
    return head+lineChart(datasets,{area:datasets.length===1, max:100, fmtY:v=>Math.round(v)+"%"});
  }

  // GetUniqueUsersResponse: {as_of,granularity,current:{unique_users,range,time_series:[{period,unique_users}]},previous:{unique_users,range}|null}
  function renderUniqueUsers(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const cur=d.current||{};
    const prev=d.previous; // may be null
    const ts=cur.time_series||[];
    if(!ts.length && !(cur.unique_users) && prev==null) return anaNoData(res);
    let h=statCompare(cur.unique_users, prev?prev.unique_users:null, t("ana.thisWindow"), t("ana.prevWindow"));
    if(ts.length){
      h+=lineChart([{label:t("ana.uniqueUsersSeries"), color:"var(--bar1)",
        values:ts.map(p=>({label:p.period, value:p.unique_users}))}], {area:true});
    }
    return h;
  }

  // GetVersionDistributionResponse: {entries:[{release_version,device_count,percentage}],total_devices,active_window_days,as_of}
  function renderVersionDist(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const entries=d.entries||[];
    if(!entries.length) return `<div class="empty">${esc(t("ana.noActiveDevices"))}</div>`;
    const rows=entries.map(e=>({label:e.release_version||t("ana.unknownVersion"), value:e.device_count, pct:e.percentage}));
    const stats=`<div class="stats"><div class="stat"><span class="n">${num(d.total_devices)}</span><span class="l">${esc(t("ana.totalDevices"))}</span></div>`+
      `<div class="stat"><span class="n">${entries.length}</span><span class="l">${esc(t("ana.versions"))}</span></div></div>`;
    return stats+hbarChart(rows, {color:"var(--bar1)"});
  }

  // GetActivityHeatmapResponse: {cells:[{day_of_week_utc,hour_utc,average_active_devices}],busiest_day_of_week_utc,busiest_hour_utc,...}
  function renderHeatmap(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const cells=d.cells||[];
    if(!cells.length) return `<div class="empty">${esc(t("chart.noData"))}</div>`;
    return heatmapGrid(cells, d.busiest_day_of_week_utc, d.busiest_hour_utc);
  }

  // GetActiveHoursResponse: {hourly:[{hour_utc,average_active_devices}],recommended_window_start_utc,recommended_window_length_hours,busiest_hour_utc,...}
  function renderActiveHours(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const hourly=d.hourly||[];
    if(!hourly.length || !hourly.some(x=>(Number(x.average_active_devices)||0)>0)) return `<div class="empty">${esc(t("chart.noActivity"))}</div>`;
    let note="";
    if(d.recommended_window_start_utc!=null){
      const s=d.recommended_window_start_utc, len=d.recommended_window_length_hours||2, e=(s+len)%24;
      note=`<div class="kv" style="margin-bottom:.4rem"><span>${t("ana.recWindow_html",{s:pad2(s), e:pad2(e)})}</span>`+
        (d.busiest_hour_utc!=null?`<span>${t("ana.busiest_html",{h:pad2(d.busiest_hour_utc)})}</span>`:"")+`</div>`;
    }
    return note+activeHoursChart(hourly, d.recommended_window_start_utc, d.recommended_window_length_hours, d.busiest_hour_utc);
  }

  // GetNewDevicesResponse: {current,previous|null,window_days,as_of} — totals only, no series.
  function renderNewDevices(res){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    if(d.current==null && d.previous==null) return anaNoData(res);
    return statCompare(d.current, d.previous==null?null:d.previous, t("ana.new30"), t("ana.prev30"))+
      `<div class="muted" style="font-size:12px;margin-top:.4rem">${esc(t("ana.newDevicesNote"))}</div>`;
  }

  // GetPatchMetricResponse: {as_of,granularity,current:{count,range,time_series:[{period,count}]},previous:{count,range}|null}
  function renderPatchMetric(res, kind){
    if(!res.ok) return anaNoData(res);
    const d=res.data||{};
    const cur=d.current||{};
    const prev=d.previous;
    const ts=cur.time_series||[];
    const hasData=(cur.count||0)>0 || ts.some(p=>(p.count||0)>0) || (prev && prev.count);
    if(!hasData) return anaNoData(res);
    let h=statCompare(cur.count, prev?prev.count:null, t("ana.thisWindow"), t("ana.prevWindow"));
    if(ts.length){
      h+=lineChart([{label:t("ana.series."+kind), color:kind==="downloads"?"var(--bar2)":"var(--bar1)",
        values:ts.map(p=>({label:p.period, value:p.count}))}], {area:true});
    }
    return h;
  }

  // ---------- shell ----------
  function showApp(){
    $("gate").hidden=true; $("app").hidden=false;
    const host=(state.base||location.origin).replace(/^https?:\/\//,"");
    const el=$("connHost"); el.textContent=host; el.title=state.base||location.origin;
  }
  function showGate(){ $("gate").hidden=false; $("app").hidden=true; }
  function disconnect(){
    state.key=""; localStorage.removeItem(LS.key); $("key").value="";
    state.apps=[]; state.orgs=[]; state.selected=null; state.selectedOrg=null; state.me=null;
    setStatus("","conn.notConnected"); showGate();
  }
  function copyText(text){
    try{ if(navigator.clipboard) navigator.clipboard.writeText(text); toast(t("toast.copied"),"ok"); }
    catch(e){ toast(t("toast.copyFailed"),"err"); }
  }
  function codeBlock(text){
    return `<div class="codeblock"><button class="copybtn" data-copytext="${esc(text)}">${esc(t("common.copy"))}</button>${esc(text)}</div>`;
  }
  function skeletonDetail(){
    const bar=(w)=>`<div class="skeleton" style="width:${w}"></div>`;
    return `<div class="panel"><div class="bd">${bar("38%")}${bar("72%")}${bar("55%")}</div></div>`+
      `<div class="section"><div class="panel"><div class="bd">${bar("28%")}${bar("86%")}${bar("64%")}${bar("74%")}</div></div></div>`;
  }
  function renderOverview(){
    const d=$("detail");
    const url=state.base||location.origin;
    const noApps=state.apps.length===0;
    const cmds=`export SHOREBIRD_HOSTED_URL=${url}\n`+
      `export SHOREBIRD_TOKEN=${t("qs.apiKey")}\n`+
      `shorebird init\n`+
      `${t("qs.setBaseUrl",{url})}\n`+
      `shorebird release android\n`+
      `shorebird patch android`;
    const title=noApps
      ? esc(t("hero.firstPatch"))
      : (state.me&&state.me.email ? t("hero.welcomeEmail_html",{email:esc(state.me.email)}) : esc(t("hero.welcome")));
    d.innerHTML=`<div class="hero"><span class="logo" aria-hidden="true">🐦</span>`+
      `<h1>${title}</h1>`+
      `<div>${esc(t(noApps?"hero.noApps":"hero.hasApps"))}</div>`+
      `<div class="ovstats">`+
      `<div class="stat"><span class="n">${state.apps.length}</span><span class="l">${esc(t("hero.apps"))}</span></div>`+
      `<div class="stat"><span class="n">${state.orgs.length}</span><span class="l">${esc(t("hero.orgs"))}</span></div>`+
      `</div></div>`+
      `<div class="qs"><h3>${esc(t("qs.title"))}</h3>`+
      `<p>${t("qs.body_html")}</p>`+
      codeBlock(cmds)+`</div>`;
  }

  // ---------- theme ----------
  function applyTheme(mode){
    if(mode==="light"||mode==="dark"){ document.documentElement.setAttribute("data-theme",mode); }
    else { document.documentElement.removeAttribute("data-theme"); }
  }
  function toggleTheme(){
    const cur=localStorage.getItem(LS.theme)||"auto";
    const next=cur==="auto"?"light":(cur==="light"?"dark":"auto");
    localStorage.setItem(LS.theme,next);
    applyTheme(next);
    toast(t("theme.toast",{mode:t("theme."+next)}),"");
  }

  // ---------- language ----------
  // Re-runs `draw` (which rebuilds #detail) while carrying over what the user
  // typed and any result boxes — e.g. a newly issued API key that is shown
  // only once must not vanish because the language was switched.
  function redrawKeepingInput(draw){
    const d=$("detail");
    const vals={}, outs={};
    d.querySelectorAll("input[id],select[id]").forEach(e=>{ vals[e.id]=e.value; });
    d.querySelectorAll('[id$="Out"]').forEach(e=>{ outs[e.id]=e.innerHTML; });
    const open=[...d.querySelectorAll("details[data-release][open]")].map(e=>e.dataset.release);
    draw();
    Object.keys(vals).forEach(id=>{ const e=$(id); if(e && d.contains(e)) e.value=vals[id]; });
    Object.keys(outs).forEach(id=>{ const e=$(id); if(e && d.contains(e)) e.innerHTML=outs[id]; });
    // Re-opening fires each release's toggle handler, which reloads its patches.
    d.querySelectorAll("details[data-release]").forEach(e=>{ if(open.includes(e.dataset.release)) e.open=true; });
  }

  // Switches the UI language and redraws the current view. The sidebar, the
  // app header/tabs and the org team view are redrawn from memory; the open
  // app tab is rebuilt, so its lazily loaded parts (live patches, expanded
  // releases' patches, analytics, collaborators) are fetched again.
  function setLang(next){
    if(!LANGS.includes(next)) return;
    lang=next;
    try{ localStorage.setItem(LS.lang, lang); }catch(e){}
    applyStaticI18n();
    setStatus(lastStatus.cls, lastStatus.key, lastStatus.vars);
    setConnError(lastConnError);
    if($("app").hidden) return;
    renderApps(); renderOrgs(); renderTeamOrgs();
    if(state.selected){
      if(state.appData && state.appData.appId===state.selected.app_id) redrawKeepingInput(mountAppShell);
      // else: the app is still loading; selectApp draws it in the new language.
    } else if(state.selectedOrg!=null){
      if(state.teamView && state.teamView.orgId===state.selectedOrg) redrawKeepingInput(drawTeam);
      // else: the team is still loading; selectOrg draws it in the new language.
    } else renderOverview();
  }
  function toggleLang(){ setLang(lang==="ko"?"en":"ko"); }

  // ---------- init ----------
  function init(){
    applyTheme(localStorage.getItem(LS.theme)||"auto");
    applyStaticI18n();
    setStatus("","conn.notConnected");
    $("base").value=state.base;
    $("key").value=state.key;
    $("connectBtn").onclick=connect;
    $("themeBtn").onclick=toggleTheme;
    $("themeBtn2").onclick=toggleTheme;
    $("langBtn").onclick=toggleLang;
    $("langBtn2").onclick=toggleLang;
    $("disconnectBtn").onclick=disconnect;
    $("createAppBtn").onclick=createApp;
    // delegated copy for code blocks / snippets
    document.addEventListener("click",e=>{
      const b=e.target.closest&&e.target.closest("[data-copytext]");
      if(b) copyText(b.getAttribute("data-copytext"));
    });
    // app filter + "/" to focus it
    $("appFilter").addEventListener("input",e=>{ state.appFilter=e.target.value; renderApps(); });
    document.addEventListener("keydown",e=>{
      const typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||"");
      if(e.key==="/" && !typing && !$("app").hidden){ e.preventDefault(); $("appFilter").focus(); }
    });
    $("key").addEventListener("keydown",e=>{ if(e.key==="Enter") connect(); });
    $("base").addEventListener("keydown",e=>{ if(e.key==="Enter") connect(); });
    if(state.key) connect();
  }
  init();
})();
</script>
</body>
</html>
